<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <title>Impressão de Etiquetas</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      .actions { margin-top: 16px; display: flex; gap: 8px; }
      .btn { border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; text-decoration: none; }
      .btn-primary { background: #2b6cb0; color: #fff; }
      .btn-secondary { background: #e2e8f0; color: #1a202c; }
      iframe { width: 100%; height: 75vh; border: 1px solid #cbd5e0; border-radius: 6px; margin-top: 12px; }
      .status-error { color: #c53030; }
    </style>
  </head>
  <body>
    <h3>Etiquetas prontas para impressão</h3>
    <p id="status">Carregando PDF...</p>
    <div class="actions">
      <button id="printBtn" class="btn btn-primary" type="button">Imprimir</button>
      <a id="openPdf" class="btn btn-secondary" href="#" target="_blank" rel="noopener">Abrir PDF</a>
    </div>
    <iframe id="pdfFrame"></iframe>

    <script>
      function getParams() {
        const params = new URLSearchParams(window.location.search);
        return { fileId: params.get('fileId') || '' };
      }

      const { fileId } = getParams();
      const statusEl = document.getElementById('status');
      const printBtn = document.getElementById('printBtn');
      const openPdf = document.getElementById('openPdf');
      const pdfFrame = document.getElementById('pdfFrame');

      if (!fileId) {
        statusEl.textContent = 'PDF não informado.';
        statusEl.className = 'status-error';
        printBtn.disabled = true;
        openPdf.style.pointerEvents = 'none';
        openPdf.style.opacity = '0.5';
      } else {
        const pdfUrl = `${window.location.origin}${window.location.pathname}?view=pdf&fileId=${encodeURIComponent(fileId)}`;
        openPdf.href = pdfUrl;
        pdfFrame.src = pdfUrl;

        pdfFrame.addEventListener('load', () => {
          statusEl.textContent = 'PDF carregado. Clique em "Imprimir" para enviar à impressora.';
          statusEl.className = '';
        });

        pdfFrame.addEventListener('error', () => {
          statusEl.textContent = 'Não foi possível carregar o PDF.';
          statusEl.className = 'status-error';
        });
      }

      printBtn.addEventListener('click', () => {
        if (!fileId) return;

        try {
          pdfFrame.contentWindow.focus();
          pdfFrame.contentWindow.print();
        } catch (error) {
          window.open(openPdf.href, '_blank', 'noopener');
        }
      });
    </script>
  </body>
</html>
