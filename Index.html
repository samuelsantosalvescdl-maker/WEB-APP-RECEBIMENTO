<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <style>
      body { font-family: Arial, sans-serif; background: #f7f7f7; margin: 0; }
      .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
      .filter-bar { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #e2e8f0; }
      .filter-content { max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
      .filter-group { display: flex; flex-direction: column; gap: 4px; }
      .filter-group label { font-size: 12px; font-weight: 600; color: #2d3748; }
      .filter-content select, .filter-content input[type="text"] { min-width: 190px; padding: 6px 8px; border-radius: 4px; border: 1px solid #cbd5e0; }
      .empty-state { background: #fff; border: 1px dashed #cbd5e0; padding: 24px; border-radius: 8px; color: #4a5568; text-align: center; }
      .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 24px; padding: 16px 20px 20px; box-shadow: 0 2px 4px rgba(0,0,0,.05); }
      .card-header { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
      .card-title { font-size: 18px; font-weight: bold; }
      .highlight-row, .summary, .header-fields-grid, .group-row { display: flex; flex-wrap: wrap; gap: 10px 18px; }
      .highlight-row { background: #f0f5ff; padding: 8px 12px; border-radius: 6px; font-weight: 600; }
      .summary { font-size: 14px; }
      .group-row { font-size: 13px; color: #4a5568; }
      .header-fields { border: 1px solid #edf2f7; border-radius: 6px; padding: 10px; background: #fafafa; margin-top: 4px; }
      .header-field { min-width: 210px; display: flex; flex-direction: column; gap: 4px; }
      .header-field label { font-size: 12px; font-weight: 600; }
      .header-field input, .header-field select, .header-field textarea { padding: 6px 8px; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 13px; }
      .header-field textarea { min-height: 56px; resize: vertical; }
      .inline-check { display: flex; gap: 6px; align-items: center; font-size: 12px; color: #4a5568; }
      .details-table, .items-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
      .details-table th, .details-table td, .items-table th, .items-table td { border: 1px solid #e5e5e5; padding: 6px 8px; font-size: 12px; }
      .items-table th { background: #fafafa; text-align: left; }
      .items-table input { width: 100%; padding: 6px; box-sizing: border-box; }
      .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 16px; }
      .btn { border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; }
      .btn-primary { background: #2b6cb0; color: #fff; }
      .btn-primary:disabled { background: #9bb5d0; cursor: not-allowed; }
      .btn-secondary { background: #e2e8f0; color: #1a202c; }
      .status { font-weight: 700; color: #2f855a; }
      .status.pending { color: #c05621; }
      .status.cancel { color: #b83280; }
      .message { margin-top: 8px; font-size: 12px; color: #c53030; }
      .muted { color: #4a5568; }
      .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 50; }
      .modal { background: #fff; border-radius: 8px; padding: 20px; width: 100%; max-width: 420px; }
      .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 16px; }
    </style>
  </head>
  <body>
    <div class="filter-bar"><div class="filter-content">
      <div class="filter-group"><label for="buyerFilter">Empresa compradora</label><select id="buyerFilter"><option value="">Selecione...</option></select></div>
      <div class="filter-group"><label for="supplierFilter">Fornecedor</label><select id="supplierFilter"><option value="">Selecione...</option></select></div>
      <div class="filter-group"><label for="labelWidthCm">Largura etiqueta (cm)</label><input id="labelWidthCm" type="text" placeholder="Ex: 5,0"></div>
      <div class="filter-group"><label for="labelHeightCm">Altura etiqueta (cm)</label><input id="labelHeightCm" type="text" placeholder="Ex: 3,0"></div>
    </div></div>
    <div class="container"><div id="orders"></div></div>
    <div id="labelsModal" class="modal-backdrop"><div class="modal"><h3>Etiquetas geradas</h3><p>Acessar PDF: <a id="pdfLink" href="#" target="_blank" rel="noopener">Abrir PDF</a></p><div class="modal-actions"><button id="closeModal" class="btn btn-primary" type="button">Ok</button></div></div></div>

    <script>
      const ordersContainer = document.getElementById('orders');
      const buyerFilter = document.getElementById('buyerFilter');
      const supplierFilter = document.getElementById('supplierFilter');
      const labelWidthInput = document.getElementById('labelWidthCm');
      const labelHeightInput = document.getElementById('labelHeightCm');
      const labelsModal = document.getElementById('labelsModal');
      const pdfLink = document.getElementById('pdfLink');
      const closeModal = document.getElementById('closeModal');
      let ordersCache = [];

      function init() {
        loadFilterOptions();
        google.script.run.withSuccessHandler((orders) => { ordersCache = orders || []; renderFilteredOrders(); }).withFailureHandler(showError).getOrdersWithItems();
        buyerFilter.addEventListener('change', renderFilteredOrders);
        supplierFilter.addEventListener('change', renderFilteredOrders);
        closeModal.addEventListener('click', closeLabelsModal);
        labelsModal.addEventListener('click', (event) => { if (event.target === labelsModal) closeLabelsModal(); });
      }

      function loadFilterOptions() {
        google.script.run.withSuccessHandler((options) => populateSelect(buyerFilter, options)).withFailureHandler(showError).getBuyerOptions();
        google.script.run.withSuccessHandler((options) => populateSelect(supplierFilter, options)).withFailureHandler(showError).getSupplierOptions();
      }

      function populateSelect(select, options) {
        const placeholder = select.querySelector('option[value=""]');
        select.innerHTML = '';
        select.appendChild(placeholder || createOption_('', 'Selecione...'));
        (options || []).forEach((value) => select.appendChild(createOption_(value, value)));
      }
      function createOption_(value, label) { const o = document.createElement('option'); o.value = value; o.textContent = label; return o; }

      function renderFilteredOrders() {
        const buyerValue = buyerFilter.value;
        const supplierValue = supplierFilter.value;
        if (!buyerValue && !supplierValue) return renderEmptyState('Selecione a empresa compradora e/ou fornecedor para visualizar pedidos.');
        const filtered = ordersCache.filter((o) => o.status !== 'RECEBIDO').filter((o) => matchesFilter(o, buyerValue, supplierValue));
        if (!filtered.length) return renderEmptyState('Nenhum pedido se adequou ao filtro.');
        renderOrders(filtered);
      }
      function renderEmptyState(message) { ordersContainer.innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`; }

      function renderOrders(orders) {
        ordersContainer.innerHTML = '';
        orders.forEach((order) => {
          const card = document.createElement('div');
          card.className = 'card'; card.dataset.oc = order.oc;
          const statusClass = order.status === 'RECEBIDO' ? 'status' : (order.status || '').startsWith('CANCEL') ? 'status cancel' : 'status pending';
          card.innerHTML = `
            <div class="card-header">
              <div class="card-title">Confirmação de Pedido</div>
              <div class="highlight-row"><div>OC: ${escapeHtml(order.oc)}</div><div>Enviado em: ${formatDate(order.sentAt)}</div><div>Status: <span class="${statusClass}">${escapeHtml(order.status || 'PENDENTE')}</span></div></div>
              <div class="summary"><div><strong>Comprador:</strong> ${escapeHtml(order.buyerSelected || '-')}</div><div><strong>Fornecedor:</strong> ${escapeHtml(order.supplierSelected || '-')}</div><div><strong>Qtd total:</strong> ${order.qtyTotal || 0}</div><div><strong>Valor total:</strong> R$ ${formatCurrency(order.valueTotal)}</div></div>
              <div class="group-row"><div><strong>OCs agrupadas:</strong> ${escapeHtml(order.groupOcs || '-')}</div><div><strong>Envios agrupados:</strong> ${escapeHtml(order.groupSentAts || '-')}</div></div>
            </div>`;

          card.appendChild(buildHeaderFields(order));
          if ((order.buyerDetails || []).length || (order.supplierDetails || []).length) card.appendChild(buildDetailsTable(order));
          card.appendChild(buildItemsTable(order));

          const actions = document.createElement('div'); actions.className = 'actions';
          const message = document.createElement('div'); message.className = 'message';
          const cancelButton = document.createElement('button'); cancelButton.className = 'btn btn-secondary'; cancelButton.textContent = 'Cancelar pedido'; cancelButton.addEventListener('click', () => handleCancel(order));
          const receiveButton = document.createElement('button'); receiveButton.className = 'btn btn-primary js-receive-btn'; receiveButton.textContent = 'Recebido'; receiveButton.dataset.locked = order.status === 'RECEBIDO' ? 'true' : 'false'; receiveButton.addEventListener('click', () => handleReceived(order, receiveButton, message));
          actions.appendChild(cancelButton); actions.appendChild(receiveButton);
          card.appendChild(actions); card.appendChild(message); ordersContainer.appendChild(card);
          updateOrderButtonState(order.oc);
        });
      }

      function buildHeaderFields(order) {
        const wrapper = document.createElement('div'); wrapper.className = 'header-fields';
        wrapper.innerHTML = `
          <div class="header-fields-grid">
            <div class="header-field">
              <label>NF</label>
              <input type="text" class="js-nf-input" value="${escapeHtml(order.nf || '')}" placeholder="Número NF">
              <label class="inline-check"><input type="checkbox" class="js-nf-nao-veio"> Não veio</label>
            </div>
            <div class="header-field">
              <label>NF Frete</label>
              <input type="text" class="js-nf-frete-input" value="${escapeHtml(order.nfFrete || '')}" placeholder="Número NF Frete">
              <label class="inline-check"><input type="checkbox" class="js-nf-frete-nao-veio"> Não veio</label>
            </div>
            <div class="header-field">
              <label>Boleto</label>
              <select class="js-boleto-select"><option value="">Selecione...</option><option value="VEIO">VEIO</option><option value="NÃO VEIO">NÃO VEIO</option></select>
            </div>
            <div class="header-field" style="flex:1 1 280px;">
              <label>Observação / comentário</label>
              <textarea class="js-comment-input" placeholder="Comentário do pedido">${escapeHtml(order.comment || '')}</textarea>
            </div>
          </div>`;

        const card = wrapper.closest('.card') || document.querySelector(`.card[data-oc="${cssEscape(order.oc)}"]`) || null;
        const nfInput = wrapper.querySelector('.js-nf-input');
        const nfFreteInput = wrapper.querySelector('.js-nf-frete-input');
        const boletoSelect = wrapper.querySelector('.js-boleto-select');
        const commentInput = wrapper.querySelector('.js-comment-input');
        const nfNaoVeio = wrapper.querySelector('.js-nf-nao-veio');
        const nfFreteNaoVeio = wrapper.querySelector('.js-nf-frete-nao-veio');

        boletoSelect.value = normalizeBoletoValue(order.boleto);
        applyNotProvidedState(nfInput, nfNaoVeio, order.nf);
        applyNotProvidedState(nfFreteInput, nfFreteNaoVeio, order.nfFrete);

        const persistHeader = () => persistNfFields(order, wrapper.closest('.card'));
        nfInput.addEventListener('blur', persistHeader);
        nfFreteInput.addEventListener('blur', persistHeader);
        boletoSelect.addEventListener('change', persistHeader);
        nfNaoVeio.addEventListener('change', () => { toggleNaoVeio(nfInput, nfNaoVeio); persistHeader(); });
        nfFreteNaoVeio.addEventListener('change', () => { toggleNaoVeio(nfFreteInput, nfFreteNaoVeio); persistHeader(); });

        commentInput.addEventListener('blur', () => persistOrderComment(order, commentInput.value, 'comment_' + order.oc));
        [nfInput, nfFreteInput, boletoSelect].forEach((el) => el.addEventListener('input', () => updateOrderButtonState(order.oc)));
        commentInput.addEventListener('input', () => updateCacheField(order.oc, 'comment', commentInput.value));
        return wrapper;
      }

      function applyNotProvidedState(input, checkbox, value) {
        const marked = normalizeText(value) === 'NAO VEIO';
        checkbox.checked = marked;
        input.disabled = marked;
        if (marked) input.value = 'não veio';
      }
      function toggleNaoVeio(input, checkbox) { if (checkbox.checked) { input.value = 'não veio'; input.disabled = true; } else { input.disabled = false; if (normalizeText(input.value) === 'NAO VEIO') input.value = ''; } }
      function normalizeBoletoValue(v) { const n = normalizeText(v); if (n === 'VEIO') return 'VEIO'; if (n === 'NAO VEIO') return 'NÃO VEIO'; return ''; }

      function persistNfFields(order, card) {
        const nfInput = card.querySelector('.js-nf-input');
        const nfFreteInput = card.querySelector('.js-nf-frete-input');
        const boletoSelect = card.querySelector('.js-boleto-select');
        const nfValue = (nfInput.value || '').trim();
        const nfFreteValue = (nfFreteInput.value || '').trim();
        const boletoValue = boletoSelect.value;
        google.script.run.withSuccessHandler(() => {
          updateCacheField(order.oc, 'nf', nfValue);
          updateCacheField(order.oc, 'nfFrete', nfFreteValue);
          updateCacheField(order.oc, 'boleto', boletoValue);
          updateOrderButtonState(order.oc);
        }).withFailureHandler(showError).updateOrderHeaderFields(order.oc, nfValue, nfFreteValue, boletoValue);
      }

      function persistOrderComment(order, commentValue) {
        const comment = String(commentValue || '');
        google.script.run.withSuccessHandler(() => updateCacheField(order.oc, 'comment', comment)).withFailureHandler(showError).updateOrderComment(order.oc, comment);
      }

      function buildDetailsTable(order) {
        const wrapper = document.createElement('div');
        const table = document.createElement('table');
        table.className = 'details-table';
        table.innerHTML = `<thead><tr><th colspan="2">Detalhes do Comprador</th><th colspan="2">Detalhes do Fornecedor</th></tr></thead><tbody><tr><td colspan="2">${renderDetailsList(order.buyerDetails)}</td><td colspan="2">${renderDetailsList(order.supplierDetails)}</td></tr></tbody>`;
        wrapper.appendChild(table); return wrapper;
      }

      function buildItemsTable(order) {
        const table = document.createElement('table'); table.className = 'items-table';
        table.innerHTML = '<thead><tr><th>Código</th><th>Item</th><th>Unidade</th><th>Quantidade</th><th>Valor Unitário</th><th>Total (R$)</th><th>Qtd recebida</th><th>Validade</th><th>Etiquetas</th></tr></thead>';
        const body = document.createElement('tbody');
        order.items.forEach((item) => {
          const row = document.createElement('tr');
          row.innerHTML = `<td>${escapeHtml(item.code || '')}</td><td>${escapeHtml(item.item || '')}</td><td>${escapeHtml(item.unit || '')}</td><td>${formatNumber(item.qty)}</td><td>${formatCurrency(item.unitPrice)}</td><td>${formatCurrency(item.total)}</td>`;
          const qtyInput = buildInput('number', item.qtyReceived, 'Quantidade recebida');
          const validityInput = buildInput('text', item.validity, 'Validade dd/MM/yyyy');
          const labelInput = buildInput('number', item.labels, 'Etiquetas');
          validityInput.addEventListener('blur', () => { validityInput.value = normalizeBrDateInput(validityInput.value) || validityInput.value; saveItem(order.oc, item.lineNo, qtyInput, validityInput, labelInput, item.rowIndex); });
          qtyInput.addEventListener('blur', () => saveItem(order.oc, item.lineNo, qtyInput, validityInput, labelInput, item.rowIndex));
          labelInput.addEventListener('blur', () => saveItem(order.oc, item.lineNo, qtyInput, validityInput, labelInput, item.rowIndex));
          [qtyInput, validityInput, labelInput].forEach((el) => el.addEventListener('input', () => updateOrderButtonState(order.oc)));
          row.appendChild(wrapCell(qtyInput)); row.appendChild(wrapCell(validityInput)); row.appendChild(wrapCell(labelInput));
          body.appendChild(row);
        });
        table.appendChild(body);
        return table;
      }

      function buildInput(type, value, placeholder) { const input = document.createElement('input'); input.type = type; input.placeholder = placeholder; if (value !== null && value !== undefined) input.value = value; return input; }
      function wrapCell(element) { const td = document.createElement('td'); td.appendChild(element); return td; }

      function saveItem(oc, lineNo, qtyInput, validityInput, labelInput, rowIndex) {
        const qtyValue = parseNumber(qtyInput.value);
        const validityValue = normalizeBrDateInput(validityInput.value);
        const labelsValue = parseNumber(labelInput.value);

        if (!isPositiveNumber(qtyValue)) return showError({ message: 'Quantidade recebida deve ser maior que zero.' });
        if (!validityValue) return showError({ message: 'Validade inválida. Use dd/MM/aaaa.' });
        if (!isPositiveInteger(labelsValue)) return showError({ message: 'Etiquetas deve ser um inteiro positivo.' });

        validityInput.value = validityValue;
        google.script.run.withSuccessHandler(() => {
          updateItemCache(oc, lineNo, { qtyReceived: qtyValue, validity: validityValue, labels: labelsValue, rowIndex });
          updateOrderButtonState(oc);
        }).withFailureHandler(showError).updateItemFields(oc, lineNo, qtyValue, validityValue, labelsValue, rowIndex);
      }

      function updateOrderButtonState(oc) {
        const card = document.querySelector(`.card[data-oc="${cssEscape(oc)}"]`); if (!card) return;
        const btn = card.querySelector('.js-receive-btn'); if (!btn || btn.dataset.locked === 'true') return;
        btn.disabled = !isOrderComplete(getOrderStateFromCard(card));
      }

      function getOrderStateFromCard(card) {
        const oc = card.dataset.oc;
        const cached = ordersCache.find((o) => String(o.oc) === String(oc)) || { items: [] };
        const rows = [...card.querySelectorAll('.items-table tbody tr')];
        const items = rows.map((row, index) => {
          const fields = row.querySelectorAll('input');
          return { lineNo: cached.items[index] ? cached.items[index].lineNo : index + 1, qtyReceived: parseNumber(fields[0].value), validity: normalizeBrDateInput(fields[1].value), labels: parseNumber(fields[2].value) };
        });
        return { oc, nf: card.querySelector('.js-nf-input').value, nfFrete: card.querySelector('.js-nf-frete-input').value, boleto: card.querySelector('.js-boleto-select').value, items };
      }

      function isOrderComplete(order) {
        const headerOk = !!String(order.nf || '').trim() && !!String(order.nfFrete || '').trim() && ['VEIO', 'NÃO VEIO'].includes(order.boleto);
        const itemsOk = (order.items || []).length > 0 && order.items.every((item) => isPositiveNumber(item.qtyReceived) && !!normalizeBrDateInput(item.validity) && isPositiveInteger(item.labels));
        return headerOk && itemsOk;
      }

      function handleReceived(order, button, message) {
        message.textContent = '';
        const labelWidth = parseNumber(labelWidthInput.value);
        const labelHeight = parseNumber(labelHeightInput.value);
        if (!isPositiveNumber(labelWidth) || !isPositiveNumber(labelHeight)) return (message.textContent = 'Informe largura e altura válidas para as etiquetas.');

        const card = document.querySelector(`.card[data-oc="${cssEscape(order.oc)}"]`);
        if (!card || !isOrderComplete(getOrderStateFromCard(card))) return (message.textContent = 'Preencha todos os campos obrigatórios do cabeçalho e dos itens.');

        const printWindow = window.open('about:blank', '_blank');
        if (printWindow) printWindow.document.write('<p>Gerando PDF...</p>');
        button.disabled = true; button.textContent = 'Processando...';

        google.script.run.withSuccessHandler((response) => {
          updateCacheField(order.oc, 'status', response.status || 'RECEBIDO');
          removeOrderCard(order.oc);
          const fileId = response && response.pdfFileId ? response.pdfFileId : '';
          const printUrl = buildPrintUrl(fileId);
          if (printWindow && printUrl) printWindow.location.href = printUrl;
          openLabelsModal(response && response.pdfUrl ? response.pdfUrl : '#');
        }).withFailureHandler((error) => {
          button.disabled = false; button.textContent = 'Recebido'; message.textContent = error.message || 'Falha ao marcar como recebido.'; if (printWindow) printWindow.close();
        }).receiveOrder(order.oc, labelWidth, labelHeight);
      }

      function handleCancel(order) {
        if (!confirm('Tem certeza que deseja cancelar este pedido?')) return;
        google.script.run.withSuccessHandler((response) => {
          updateCacheField(order.oc, 'status', response && response.status ? response.status : 'CANCEL_PENDENTE');
          removeOrderCard(order.oc);
          renderFilteredOrders();
        }).withFailureHandler(showError).cancelOrderStub(order.oc);
      }

      function renderDetailsList(list) { if (!list || !list.length) return '<span class="muted">Sem detalhes</span>'; return `<ul>${list.map((i) => `<li>${escapeHtml(i)}</li>`).join('')}</ul>`; }
      function showError(error) { alert(error.message || 'Erro inesperado.'); }

      function parseNumber(value) { if (value === null || value === undefined || value === '') return NaN; return Number(String(value).replace(',', '.')); }
      function isPositiveNumber(value) { return !Number.isNaN(Number(value)) && Number(value) > 0; }
      function isPositiveInteger(value) { return Number.isInteger(Number(value)) && Number(value) > 0; }
      function normalizeBrDateInput(value) {
        if (!value) return '';
        const clean = String(value).trim().replace(/[-.]/g, '/');
        const p = clean.split('/'); if (p.length !== 3) return '';
        const d = Number(p[0]); const m = Number(p[1]); const y = Number(p[2]);
        if (!Number.isInteger(d) || !Number.isInteger(m) || !Number.isInteger(y)) return '';
        const date = new Date(y, m - 1, d);
        if (date.getFullYear() !== y || date.getMonth() !== (m - 1) || date.getDate() !== d) return '';
        return `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${String(y).padStart(4, '0')}`;
      }

      function openLabelsModal(url) { pdfLink.href = url || '#'; labelsModal.style.display = 'flex'; }
      function closeLabelsModal() { labelsModal.style.display = 'none'; }
      function removeOrderCard(oc) { const card = document.querySelector(`.card[data-oc="${cssEscape(oc)}"]`); if (card) card.remove(); }
      function updateCacheField(oc, field, value) { const o = ordersCache.find((it) => String(it.oc) === String(oc)); if (o) o[field] = value; }
      function updateItemCache(oc, lineNo, values) { const o = ordersCache.find((it) => String(it.oc) === String(oc)); if (!o) return; const item = (o.items || []).find((it) => Number(it.lineNo) === Number(lineNo)); if (item) Object.assign(item, values); }
      function buildPrintUrl(fileId) { if (!fileId) return ''; const base = window.location.href.split('?')[0]; return `${base}?view=print&fileId=${encodeURIComponent(fileId)}`; }
      function formatCurrency(value) { return Number(value || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
      function formatNumber(value) { return Number(value || 0).toLocaleString('pt-BR'); }
      function formatDate(value) { if (!value) return '-'; const d = new Date(value); return Number.isNaN(d.getTime()) ? value : d.toLocaleString('pt-BR'); }
      function escapeHtml(value) { return String(value || '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char] || char)); }
      function cssEscape(value) { return String(value).replace(/"/g, '\\"'); }
      function normalizeText(value) { return String(value || '').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' '); }
      function matchesFilter(order, buyerValue, supplierValue) {
        const buyerText = `${order.buyerSelected || ''} ${(order.buyerDetails || []).join(' ')}`;
        const supplierText = `${order.supplierSelected || ''} ${(order.supplierDetails || []).join(' ')}`;
        const buyerMatch = buyerValue ? normalizeText(buyerText).includes(normalizeText(buyerValue)) : true;
        const supplierMatch = supplierValue ? normalizeText(supplierText).includes(normalizeText(supplierValue)) : true;
        return buyerMatch && supplierMatch;
      }

      window.addEventListener('load', init);
    </script>
  </body>
</html>
